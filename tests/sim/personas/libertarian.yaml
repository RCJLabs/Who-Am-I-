  # Consistent on bodily autonomy (high everywhere), protecting the vulnerable and paid markets
  # (low everywhere). Two real splits: caution with the irreversible is high on executions but low
  # on gene editing, and truth matters more in what we tell others than in one's own life. The
  # rights topics add no tensions: liberty and due process high everywhere, and protecting the
  # vulnerable low on guns as on drugs and vaccines. Economics adds one: just deserts demanded of
  # people who could work but not of heirs. Paid markets stay acceptable in healthcare too.
  # Governance adds two, both on deferring to experts: economists should decide on rents, but
  # not experts in general or doctors on school vaccines. National self-government and deciding
  # locally stay high everywhere.
  # Society adds none: the same rules for everyone in all four places, deserved punishment and
  # personal responsibility weighed alike in both, and bodily autonomy high for transition too.
  # Open to immigration but not to aid or international bodies, so the diplomatic score is mixed.
  # In worldview: belief that fits the evidence about God, but belief in free will kept for the
  # good it does; and biologists followed on teaching evolution more than public-health experts on
  # school vaccines.
  # In how you know: evidence for remedies like homeopathy, though belief in free will is kept for
  # the good it does; independent checks for vaccines and police alike.
