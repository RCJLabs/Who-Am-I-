  # The mirror image of the religious conservative: bodily autonomy and protecting the vulnerable
  # flip on vaccines; the sanctity of life and caution with the irreversible are high on the death
  # penalty but low on abortion, assisted dying and gene editing. And Rachels's target: killing and
  # letting die are the same in end-of-life care, but not when pushing a stranger onto the tracks.
  # In the rights topics, each new principle flips the other way from the religious conservative:
  # protecting the vulnerable high on guns, liberty high for private messages but not speech,
  # obeying the law required of religious objectors but not protesters, due process demanded before
  # losing freedom but not guns, and doing vs. allowing high for torture. In the economics topics,
  # just deserts is demanded of heirs but not of people who could work, and money shouldn't buy
  # quicker medical treatment, though surrogates may be paid.
  # In governance, the mirror image again: no outside interference in who rules a country, but
  # international courts may try a country's soldiers; minimum wages may be set locally, but
  # school curricula may not; and experts should decide in general and on school vaccines, but
  # not economists on rents.
  # In society, each new anchor flips again: the same rules whatever someone's race or sex for police
  # stops and marriage, but not for admissions or boards; deserved punishment for officers who kill
  # unlawfully but not for violent crime when rehabilitation works; people brought as children
  # shouldn't pay for others' wrongs, but today's taxpayers may owe for old ones; who settles isn't
  # each country's call alone, though who rules it is; no special caution with under-18s' treatment,
  # though there is for executions; and adults decide about transition, though not about vaccines.
  # In environment: future generations on climate, though not on debt; climate scientists, but not
  # economists on rents, and food-safety scientists less than climate or public-health experts;
  # crops' genes shouldn't be engineered, though embryos' may be; caution about nuclear power and AI,
  # though not about embryo editing or under-18s' treatment; and no local say over wind farms, though
  # local minimum wages are fine.
  # In worldview: a brutal childhood lessens what someone deserves, though officers who kill
  # unlawfully should get what they deserve; and biologists are followed on teaching evolution, but
  # not economists on rents, and food-safety scientists less.
  # In how you know: police accounts after a shooting checked independently before they're
  # believed, but not a regulator's word on a new vaccine.
