# yaml-language-server: $schema=../../../schema/analysis/sheet.schema.json
# Social liberalism: the app's political questions, and the statements behind the compared principles,
# answered as a thoughtful adherent would, from the tradition's own writers. Written blind: the
# author saw only this tradition and its sources. The compiler scores it like anyone's answers.
tradition: social_liberal
sources:
  - John Stuart Mill, On Liberty (1859)
  - L. T. Hobhouse, Liberalism (1911)
  - John Rawls, A Theory of Justice (1971)
answers:
  fairness.stance: 5   # Inequalities are just only if they also benefit the least advantaged (Rawls, A Theory of Justice)
  abortion.stance: 6   # Procreative autonomy, with clinical limits late in pregnancy (R. Dworkin, Life's Dominion)
  assisted_dying.stance: 6   # Each adult is sovereign over their own body and life, with safeguards against pressure (Mill, On Liberty)
  vaccine_mandates.stance: 5   # The harm principle allows compulsion to protect others from infection, short of general mandates (Mill, On Liberty)
  death_penalty.stance: 1   # Irreversible, error-prone and at odds with equal dignity; Mill's 1868 defense of it is not followed today
  drug_policy.stance: 5   # Treat use as a health matter, not a crime; legal sale of hard drugs stays a minority view (Mill, On Liberty)
  paternalism.stance: 5   # Mill's anti-paternalism, softened: small, low-cost protections can serve autonomy (G. Dworkin, "Paternalism")
  organ_donation.stance: 2   # Cover donors' costs, but a price would press hardest on the poor (Satz, Why Some Things Should Not Be for Sale)
  gene_editing.stance: 5   # Preventing serious disease serves fair opportunity; enhancement raises justice worries (Buchanan et al., From Chance to Choice)
  surveillance.stance: 2   # Privacy needs targeted warrants and independent oversight, not blanket monitoring
  religious_liberty.stance: 2   # Conscience is free in belief and worship, but services to the public must treat citizens equally (Rawls, A Theory of Justice)
  protest.stance: 3   # Civil disobedience accepts the penalty, but courts should weigh conscience and lighten the sanction (Rawls, A Theory of Justice)
  torture.stance: 1   # An absolute bar: torture violates the dignity that law exists to protect (Waldron, "Torture and Positive Law")
  public_safety.stance: 2   # Due process and the presumption of innocence belong to the rule of law (Rawls, A Theory of Justice)
  taxes.stance: 5   # Progressive taxes fund fair opportunity and a decent minimum (Hobhouse, Liberalism)
  healthcare.stance: 5   # Universal cover protects fair equality of opportunity; private top-ups allowed (Daniels, Just Health)
  welfare.stance: 5   # The state secures the conditions of self-support: an income to live on plus help back to work (Hobhouse, Liberalism)
  minimum_wage.stance: 6   # A living wage is a condition of freedom (Hobhouse, Liberalism); floors near 60% of typical pay
  regulation.stance: 5   # Rules keep markets fair, safe and competitive without the state running them (Hobhouse, Liberalism)
  unions.stance: 5   # Collective bargaining offsets workers' weaker position; strikes within fair limits (Hobhouse, Liberalism)
  trade.stance: 5   # Free trade widens opportunity (Mill, Principles of Political Economy); those who lose out are owed help to adjust
  inheritance.stance: 5   # Large unearned fortunes undercut fair opportunity (Mill, Principles of Political Economy; Rawls, A Theory of Justice)
  policing.stance: 5   # More visible, accountable community policing, without wider powers
  same_sex_marriage.stance: 7   # Equal standing for all families, in law and in schools, secures everyone's self-respect (Rawls, A Theory of Justice)
  transgender.stance: 6   # People define their own identity; case-by-case limits where others' safety or fairness is at stake (Mill, On Liberty)
  gender_roles.stance: 6   # Equality of the sexes at home and at work, including leave reserved for fathers (Mill, The Subjection of Women)
  prisons.stance: 5   # Punishment should rehabilitate: alternatives for first offenders, prison for violence or repeat offending
  climate.stance: 5   # Justice between generations requires net zero by mid-century, accepting some cost (Rawls, A Theory of Justice)
  cooperation.stance: 6   # Shared problems need binding, majority-based rules; pooled sovereignty extends what countries can do
  foreign_aid.stance: 6   # The 0.7% target; well-off peoples owe a duty of assistance to burdened societies (Rawls, The Law of Peoples)
  marriage.stance: 6   # No-fault divorce after a short wait; marriage is a partnership of equals (Mill, The Subjection of Women)
  gambling.stance: 5   # Gambling must be tolerated, but those who profit from promoting it may be restrained (Mill, On Liberty)
  moral_foundations.loyalty_1: 3   # Allegiance is owed to just institutions more than to the nation as such; loyal dissent is prized (Rawls, A Theory of Justice)
  moral_foundations.equality_3: 2   # Open chances are not enough: inequalities must also benefit the least advantaged (Rawls, A Theory of Justice)
  moral_foundations.liberty_3: 3   # Restraint can serve freedom (Hobhouse, Liberalism), but basic liberties outrank general welfare (Rawls)
  moral_foundations.deserts_1: 3   # Effort deserves reward, but talents and luck are morally arbitrary and need comes first (Rawls, A Theory of Justice)
  moral_foundations.equality_1: 4   # A wider spread of wealth would widen real freedom (Hobhouse, Liberalism)
  moral_foundations.loyalty_3: 2   # Citizens owe duties of fair play to the institutions they share (Rawls, A Theory of Justice)
  moral_foundations.deserts_2: 4   # Society is a fair system of cooperation, so free-riding wrongs those who contribute (Rawls, A Theory of Justice)
  moral_foundations.liberty_1: 2   # The state mostly enables freedom; overreach is resisted case by case, as with surveillance (Hobhouse, Liberalism)
  moral_foundations.equality_2: 2   # Inequality is not unjust in itself, only when it fails the least advantaged (Rawls, A Theory of Justice)
  moral_foundations.deserts_3: 4   # A decent minimum for all comes before rewards for effort (Hobhouse, Liberalism)
  moral_foundations.loyalty_2: 2   # Individuals must be free to leave families and groups that stifle them (Mill, On Liberty)
  moral_foundations.liberty_2: 4   # Each should pursue their own good in their own way (Mill, On Liberty)
  organ_donation.anchor_ml: 5   # Leans to a ban to protect the poor, while feeling the pull of adult consent (Satz, Why Some Things Should Not Be for Sale)
  free_speech.anchor_liberty: 6   # Free expression is the default even for hateful views; any limits are narrow (Mill, On Liberty)
  surveillance.anchor_liberty: 6   # Private communication protects free thought; access only by targeted warrant
  healthcare.anchor_ml: 3   # Private care may be bought, provided the public system serves everyone well (Daniels, Just Health)
  welfare.anchor_desert: 1   # Desert is not the basis of distributive justice; no one should suffer for joblessness they cannot help (Rawls, A Theory of Justice)
  unions.anchor_loyal: 2   # Individual judgment outweighs group pressure; the right to strike includes the right not to (Mill, On Liberty)
  inheritance.anchor_desert: 5   # Large inheritances are unearned and skew opportunity, though modest bequests are fine (Mill, Principles of Political Economy)
  war.anchor_loyal: 2   # Citizens may dissent from, and refuse to fight in, an unjust war (Rawls, A Theory of Justice)
  marriage.anchor_lib: 6   # Adults must be free to end a marriage, even if some that could be saved will end
  family_crime.anchor_loyal: 2   # Impartial justice and victims' rights outweigh family loyalty, though the pull is understood
  work.anchor_cw: 3   # Those who support themselves may choose not to work; it is their own affair (Mill, On Liberty)
  work.anchor_lib: 2   # Legal limits on hours secure what workers cannot win one by one (Mill, Principles of Political Economy)
  health.anchor_cw: 6   # Pooling health risks is what people would choose not knowing their own fortunes (Rawls, A Theory of Justice)
  gambling.anchor_lib: 5   # Gambling must be tolerated, though its promoters may be restrained (Mill, On Liberty)
divided:
  - sex_work.stance   # Decriminalizers citing autonomy and harm reduction (Nussbaum, "Taking Money for Bodily Services") vs Nordic-model supporters who criminalize buyers
  - surrogacy.stance   # Unpaid surrogacy with costs covered, the usual European view, vs paid surrogacy under strict rules, common among American social liberals
  - free_speech.stance   # Intent-based incitement laws (Waldron, The Harm in Hate Speech) vs banning only threats and incitement to violence, mostly in the US (R. Dworkin)
  - guns.stance   # European adherents allow licensed hunting and sport only (2); many American adherents accept owning guns for self-defense with licensing and checks (3-5)
  - housing.stance   # Inflation-linked limits within longer tenancies, common among European adherents, vs caps only on steep rises, with building doing the main work, as in several American states
  - immigration.stance   # More legal routes and higher numbers (Carens, "Aliens and Citizens") vs holding or trimming current levels for integration, varying by country
  - sex_work.anchor_ml   # Nordic-model supporters agree; decriminalizers who stress adult consent disagree
  - surrogacy.anchor_ml   # Supporters of unpaid-only surrogacy agree; those backing regulated paid surrogacy disagree
