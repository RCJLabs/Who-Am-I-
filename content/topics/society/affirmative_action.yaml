# yaml-language-server: $schema=../../../schema/topic.schema.json
# Whether universities and employers should take race into account. No spectrum: treating every
# applicant the same regardless of race was the 1964 Civil Rights Act's principle, so it can't be
# scored as the "tradition" end, and race-conscious policy divides people within the left and
# within the right. The anchor is the same rules whatever someone's race (admissions, where the
# right tends to invoke it); the left invokes the same principle in policing and same_sex_marriage.
# Yields toward counting race record equality (narrowing gaps); toward race-neutral rules, the same
# rules for everyone.
id: affirmative_action
domain: society
title: Race in admissions and hiring
summary: Should universities and employers take race into account when choosing people?
tier: extended
order: 5
evidence: custom
stance: stance
importance: importance
items:
  - id: stance
    type: slider
    steps: 7
    text: When universities and employers choose among qualified applicants, race should…
    poles: [Never count, Count through reserved places]
    labels:
      - Never count, not even in outreach or scholarships
      - Never count in decisions, though recruiting widely in every community is fine
      - Not count, but disadvantages that often go with it, like low family income, should
      - Torn / it depends
      - Count as one factor among many, to bring together people of varied backgrounds
      - Count heavily, to make up for past and present discrimination
      - Count through reserved places, so each group's share matches its share of the population

  - id: importance
    type: importance
    text: How much does this issue matter to you?

  # --- Circumstances ---------------------------------------------------------------------------
  - id: legacy
    type: slider
    steps: 5
    tags: [circumstance]
    text: Universities giving an advantage to children of their graduates is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]
    principles: { equal_treatment: -0.5 }

  - id: income
    type: slider
    steps: 5
    tags: [circumstance]
    text: Giving extra weight to applicants from low-income families, whatever their race, is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]
    principles: { equality: 0.5 }

  - id: interview_rule
    type: slider
    steps: 5
    tags: [circumstance]
    text: Requiring employers to interview at least one candidate from an underrepresented group for senior jobs is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]
    principles: { equal_treatment: -0.5 }

  - id: scholarships
    type: slider
    steps: 5
    deep: true
    tags: [circumstance]
    text: Scholarships open only to students of one race are…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]
    principles: { equal_treatment: -0.5 }

  # --- Anchor ------------------------------------------------------------------------------------
  - id: anchor_same
    type: likert
    points: 7
    text: When it comes to university admissions, everyone should be treated by the same rules, whatever their race, even when that means fewer Black and Hispanic students at the most selective universities.
    principles: { equal_treatment: 1 }
    anchor: { principle: equal_treatment, context: university admissions, against: diversity and making up for past discrimination }

  # --- Challenges: for counting race -------------------------------------------------------------
  - id: ch_prop_209
    type: challenge
    name: After the ban
    targets: stance
    when: stance < 0
    source: >-
      Zachary Bleemer, "Affirmative Action, Mismatch, and Economic Mobility after California's
      Proposition 209," Quarterly Journal of Economics (2022)
    scenario: >-
      In 1996 California voters banned considering race in admissions to the state's public
      universities, starting in 1998. A later study found that afterwards, Black and Hispanic
      applicants went to less selective campuses and earned fewer degrees, including in science and
      engineering, and their later wages were about 5% lower, a fall driven by Hispanic applicants.
    text: If the ban held back the very students it was meant to treat fairly, was it right?
    options:
      - id: same_rules
        label: Yes. Treating every applicant the same is right, even when some groups lose ground.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: disadvantage
        label: The answer is help based on disadvantage, like income, not on race.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me more open to counting race than I said.
        reaction: yield
        revise: stance
        principles: { equality: 0.5 }

  - id: ch_fifty_fifty
    type: challenge
    name: Fifty-fifty
    targets: stance
    when: stance < 0
    source: >-
      Independent Commission on Policing for Northern Ireland, A New Beginning (1999); Police
      (Northern Ireland) Act 2000
    scenario: >-
      When Northern Ireland reformed its police after decades of conflict, about 8% of officers came
      from a Catholic background. From 2001 to 2011 it hired recruits from Catholic and non-Catholic
      backgrounds in equal numbers, and the Catholic share rose to about 30%. The aim was a police
      service that both communities could trust.
    text: Can taking group membership into account be right when an institution needs everyone's trust?
    options:
      - id: individuals
        label: No. Recruits should be chosen as individuals, whatever their background.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: after_conflict
        label: In a society coming out of conflict, perhaps, but not in ordinary admissions and hiring.
        reaction: distinguish
        value: 0
      - id: rethink
        label: Yes. It makes me more open to counting race than I said.
        reaction: yield
        revise: stance
        principles: { equality: 0.5 }

  - id: ch_legacies
    type: challenge
    name: The other preferences
    targets: stance
    deep: true
    when: stance < 0
    source: >-
      Peter Arcidiacono, Josh Kinsler and Tyler Ransom, "Legacy and Athlete Preferences at Harvard,"
      Journal of Labor Economics (2022)
    scenario: >-
      Harvard's admissions data, made public in a lawsuit, showed that 43% of the white students it
      admitted were recruited athletes, children of graduates or staff, or on a list of applicants of
      special interest to the dean. Researchers estimated that about three-quarters of them would
      have been rejected without those advantages.
    text: If admissions already favor some groups, why single out race?
    options:
      - id: end_them
        label: Those preferences are wrong too. The answer is to end them, not to add more.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: class
        label: Wealth is the real advantage, so help applicants by income, not race.
        reaction: distinguish
        value: 0
      - id: rethink
        label: It makes me more open to counting race than I said.
        reaction: yield
        revise: stance
        principles: { equality: 0.5 }

  # --- Challenges: for race-neutral rules --------------------------------------------------------
  - id: ch_personal_ratings
    type: challenge
    name: The personal rating
    targets: stance
    when: stance > 0
    source: Students for Fair Admissions v. President and Fellows of Harvard College, 600 U.S. 181 (2023), and the 2018 trial record
    scenario: >-
      In a lawsuit against Harvard, admissions data showed that Asian American applicants had the
      highest academic ratings of any group but the lowest "personal" ratings, which covered
      qualities like likability and courage. Experts disagreed about why, and the trial judge found
      no intentional discrimination. In 2023 the US Supreme Court ended race-conscious admissions.
    text: When race counts, who pays the price?
    options:
      - id: flawed_process
        label: The ratings were a flaw in one process, not a reason to stop counting race.
        reaction: hold
        principles: { equality: 0.5 }
      - id: count_disadvantage
        label: Count disadvantage instead of race, so no group is held back.
        reaction: distinguish
        value: 0
      - id: rethink
        label: It makes me want race to count less than I said.
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }

  - id: ch_firefighters
    type: challenge
    name: The firefighters' exam
    targets: stance
    when: stance > 0
    source: Ricci v. DeStefano, 557 U.S. 557 (2009)
    scenario: >-
      In 2004 New Haven, Connecticut, threw out the results of its 2003 promotion exams for
      firefighters because no Black candidates scored high enough to be promoted. Seventeen white
      firefighters and one Hispanic firefighter who had passed sued, and in 2009 the US Supreme Court
      ruled, 5 to 4, that the city had discriminated against them.
    text: Is it fair to set aside results because of who passed?
    options:
      - id: wrong_test
        label: The exam may have measured the wrong things. Fixing a flawed test isn't discrimination.
        reaction: hold
        principles: { equality: 0.5 }
      - id: before_not_after
        label: Fix tests before they're given, not after the results are in.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me want race to count less than I said.
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }

  - id: ch_twins
    type: challenge
    name: The identical twins
    targets: stance
    deep: true
    when: stance > 0
    source: Folha de S.Paulo, "UnB recua e aceita outro gêmeo nas cotas" (June 2007)
    scenario: >-
      In 2007 the University of Brasília's panel for its racial quota, judging applicants from
      photographs, classified one of a pair of identical twins as Black and the other as not. The
      university reversed the decision on appeal.
    text: Who should decide which group a person belongs to?
    options:
      - id: one_mistake
        label: One panel's mistake doesn't undo the case for reserved places.
        reaction: hold
        principles: { equality: 0.5 }
      - id: self_description
        label: Let applicants describe themselves, with checks only for fraud.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No one should. It makes me want race to count less than I said.
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }

  # --- Challenge: the middle ---------------------------------------------------------------------
  - id: ch_vote
    type: challenge
    name: Income instead of race
    targets: stance
    when: stance == 0
    source: Original scenario
    scenario: >-
      A proposed law would bar universities from considering race, give extra weight instead to
      applicants from low-income families and struggling schools, and end preferences for children
      of graduates.
    text: You said you're torn. How would you vote?
    options:
      - id: abstain
        label: I'd leave it blank. Both sides have real force.
        reaction: hold
        value: 0
      - id: yes
        label: "Yes"
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }
      - id: no
        label: "No"
        reaction: yield
        revise: stance
        principles: { equality: 0.5 }

  - id: stance_check
    type: reask
    target: stance
    text: Having thought about these cases, where do you land now?
