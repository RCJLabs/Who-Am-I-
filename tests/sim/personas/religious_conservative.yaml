  # Bodily autonomy low on abortion, assisted dying, drugs and selling sex but high on vaccines;
  # protecting the vulnerable high on assisted dying and drugs but low on vaccines and guns; the
  # sanctity of life high on abortion and assisted dying but low on the death penalty; caution with
  # the irreversible high on gene editing but low on the death penalty. In the rights topics:
  # liberty high for speech but not for private messages; obeying the law required of protesters
  # but not of religious objectors; due process demanded before losing guns but not freedom; and
  # doing vs. allowing high for assisted dying and the footbridge but low for torturing a suspect.
  # In the economics topics: just deserts demanded of people who could work but not of heirs, and
  # money may buy quicker medical treatment but not sex or surrogacy.
  # In governance: outsiders may step in against a dictatorship, but no one may try a country's
  # own soldiers; school curricula are for local communities, but minimum wages aren't; and
  # economists should decide on rents, but not experts in general or doctors on school vaccines.
  # In society: the same rules whatever someone's race or sex for admissions and boards, but not for
  # police stops or marriage; deserved punishment for violent crime but leeway for officers who kill
  # unlawfully; no one pays for wrongs done generations ago, but people brought as children may have
  # to leave; each country decides who settles; caution with the irreversible for under-18s, though not
  # for executions; and bodily autonomy for vaccines but not for adults' medical transition.
  # In environment: no debts passed to our children, though climate weighs less; economists on rents,
  # but not climate scientists; animal welfare for imports, but not stricter rules on farms here;
  # children's genes aren't ours to engineer, though crops' may be; no special caution about nuclear
  # power, unlike embryos, under-18s' treatment or AI; and local say over wind farms, though not over
  # minimum wages.
