# Moral principles. Answers record how strongly each is endorsed per topic; anchor items
# (matched wording across topics) are what the tension detector compares. Listed in display order.

# --- Moral foundations: the moral_foundations topic measures these directly. After Moral
# Foundations Theory (Haidt, Graham and colleagues; MFQ-2 splits fairness into equality and
# proportionality), plus liberty. Issue topics feed them too.
- id: relief_of_suffering
  label: Care
  definition: Preventing suffering and caring for people in need should come first.
- id: equality
  label: Equality
  definition: People should be treated equally, and gaps in wealth and opportunity should be narrowed.
# Rewards only. Someone can hold that rewards should be earned without holding that punishment
# should match wrongdoing, so punishment is its own principle (deserved_punishment).
- id: retribution
  label: Just deserts
  definition: People should get what they deserve, with rewards that match their effort.
- id: loyalty
  label: Loyalty
  definition: People should stand by their family, community and country, even when it's costly.
- id: authority
  label: Respect for authority
  definition: Legitimate authority, tradition and social order deserve respect.
- id: purity
  label: Purity
  definition: Some things are degrading or sacred, whether or not anyone is harmed.
- id: liberty
  label: Liberty
  definition: People should be free to run their own lives, without being controlled by governments or others.

# --- Principles invoked by particular issues and dilemmas ---
- id: bodily_autonomy
  label: Bodily autonomy
  definition: People have the right to decide what happens to their own bodies.
- id: sanctity_of_life
  label: Sanctity of life
  definition: Human life has inherent worth, and deliberately ending it is wrong.
- id: protect_vulnerable
  label: Protecting the vulnerable
  definition: Laws should shield people who can't protect themselves, even at some cost to others' freedom.
- id: harm_principle
  label: Preventing harm to others
  definition: The state may limit people's freedom to stop them from harming others.
- id: due_process
  label: Due process
  definition: No one should lose their rights until a fair process has proven they did wrong, even if that lets some dangerous people go free.
- id: deserved_punishment
  label: Deserved punishment
  definition: People who do serious wrong should be punished as they deserve, whatever else the punishment achieves.
- id: obey_law
  label: Obeying the law
  definition: Laws should be obeyed even by people who think they're unjust, and changed only through legal means.
# Separate from equality, whose definition also covers narrowing gaps: in race-conscious admissions
# the two collide.
- id: equal_treatment
  label: Same rules for everyone
  definition: Everyone should be treated by the same rules, whatever group they belong to, even when that leaves gaps between groups.
- id: sovereignty
  label: National self-government
  definition: Each country should run its own affairs, without other countries or international bodies stepping in, even when it runs them badly.
- id: subsidiarity
  label: Deciding locally
  definition: Decisions should be made by the communities they affect, not by a distant government, even when some communities choose badly.
- id: expertise
  label: Deference to experts
  definition: Policy should follow the best expert judgment, even when most voters disagree.
# Who carries the burden of proof for claims from powerful bodies, not whose judgment policy
# follows (expertise) or believing beyond the evidence for the good it does (evidence). The
# Royal Society's motto is "take nobody's word for it". The left tends to invoke it about police
# accounts, the right about vaccine approvals; which side invokes it where shifts with who holds
# power.
- id: independent_checks
  label: Independent checking
  definition: Claims from powerful institutions should be checked by someone independent of them before they're believed, even when that means doubting people who are telling the truth.
- id: collective_welfare
  label: Collective welfare
  definition: Individuals should accept burdens for the good of the community.
# The left invokes it on climate, the right on government debt.
- id: future_generations
  label: Duties to future generations
  definition: We shouldn't pass the costs of what we do today on to the people who come after us.
- id: personal_responsibility
  label: Personal responsibility
  definition: People take on obligations through their own voluntary choices, and don't answer for choices they didn't make.
- id: doing_vs_allowing
  label: Doing vs. allowing
  definition: Actively causing harm is worse than failing to prevent it.
- id: market_limits
  label: Things money shouldn't buy
  definition: Some things shouldn't be bought and sold, even between consenting adults.
- id: precaution
  label: Caution with the irreversible
  definition: When a mistake can't be undone, hold back, even at the cost of real benefits.
# Care covers people; this covers animals. Worded as protection by law, so that it costs something
# to endorse: almost everyone agrees animals' suffering counts for something.
- id: animal_welfare
  label: Animal welfare
  definition: The law should protect animals from suffering, even when that costs people something.
- id: natural_order
  label: Respect for the natural order
  definition: Some things about human life and nature shouldn't be engineered or altered, even for good ends.
- id: truth
  label: Truth
  definition: Truth matters in itself, so we shouldn't deceive others, or ourselves, even for comfort.
# Clifford ("it is wrong always, everywhere, and for anyone, to believe anything upon insufficient
# evidence") against James's "will to believe". Nonbelievers tend to invoke it about God; skeptics
# do about free will, where some nonbelievers keep the belief for the good it does.
- id: evidence
  label: Belief that fits the evidence
  definition: We should believe things only as far as the evidence supports them, even when believing more would help us.
