# yaml-language-server: $schema=../../schema/analysis/suggestions.schema.json
# Links from research: published associations between one personality trait and an interest,
# each written from both ends. The `away` end describes less of the same activity, never an
# attraction the study didn't measure. A link needs a meta-analysis, or N of at least 1,000
# replicated independently, an interest or participation outcome, and an uncorrected r of at
# least .20 (lint E016); where estimates differ, `r` is the lowest. Examples come from what the
# study measured (here O*NET's descriptions of the RIASEC interest types), never a job title.
# Evidence and the candidates dropped are in TAXONOMY.md.

norms:
  # Internal only: they decide whether a link shows, and are never shown or compared with anyone.
  # Computed for this app, not published norms: no published Mini-IPIP trait means and SDs could
  # be confirmed (Baldasaro et al., 2013 print item statistics only). Data: the Open-Source
  # Psychometrics Project's BIG5 file (openpsychometrics.org/_rawdata/BIG5.zip, as mirrored at
  # github.com/haghish/openpsychometrics, BIG5/data.csv, sha256 ccf2440c364b7cf4...). 15,657 of
  # 19,719 rows: adults 18-90 who answered all 16 Mini-IPIP items for these four traits. Trait =
  # mean of the 4 keyed items, 1-5 (reversed items as 6 - x); sample SD. Limits: online volunteers
  # c. 2012, mostly English-speaking; agree/disagree anchors where the app asks how accurately
  # each describes you. Agreeableness 3.94 (0.85) and conscientiousness 3.27 (0.89) aren't listed,
  # as no link reads them.
  source: "Computed from the Open-Source Psychometrics Project's BIG5 data (2012), adults with all items (N = 15,657)"
  traits:
    # Reversal pairs: a positive item and the reversed item that negates it. Agreeing with both
    # voids the trait (response style). Echo: the items' own words, which a link never uses.
    extraversion:
      mean: 2.92
      sd: 1.02
      reversals: [[mini_ipip.e1, mini_ipip.e4], [mini_ipip.e3, mini_ipip.e2]]
      echo: [life of the party, party, parties, talk, background]
    openness:
      mean: 4.04
      sd: 0.77
      reversals: [[mini_ipip.i1, mini_ipip.i4]]
      echo: [imagination, abstract, idea, vivid]

suggestions:
  - id: artistic
    kind: working
    trait: openness
    toward: Imaginative
    r: 0.36
    outcome: interest
    interest: artistic activities, such as visual art, design, writing or music
    title: Artistic work
    away: Work where art and design play a small part
    source: "Hurtado Rúa, Stead & Poklar, Journal of Career Assessment (2019); Larson, Rottinghaus & Borgen, Journal of Vocational Behavior (2002)"
    # evidence: Hurtado Rúa et al.: multivariate meta-analysis, 34 studies, 43 samples,
    # N = 19,872; age, country and inventory tested as moderators; Openness-Artistic r = .36,
    # the largest of the 30 pairs (range -.08 to .36). Larson et al.: 24 samples, three interest
    # inventories against the NEO-PI-R; r = .48, for women and men and on every inventory.
    # Barrick, Mount & Gupta (2003; 41 samples, N = 11,559): corrected rho = .39, support only.
    # "Somewhat" on every estimate. O*NET Artistic: creating original visual artwork,
    # performances, written works, food or music. Checked against abstracts and a later paper's
    # summary of Hurtado Rúa's pair values; not yet confirmed from full texts that the pooled
    # r's are uncorrected. The Mini-IPIP has no item on art or beauty, while the NEO-PI-R has a
    # facet for it, so the link may be weaker for the app's scores.
  - id: enterprising
    kind: working
    trait: extraversion
    toward: Outgoing
    r: 0.27
    outcome: interest
    interest: leading, managing or negotiating
    title: Leading and negotiating
    away: Work where leading and negotiating play a small part
    source: "Hurtado Rúa, Stead & Poklar, Journal of Career Assessment (2019); Larson, Rottinghaus & Borgen, Journal of Vocational Behavior (2002)"
    # evidence: Extraversion-Enterprising r = .27 (Hurtado Rúa et al.) and .41 (Larson et al.);
    # Barrick et al. corrected rho = .41. "A little" on the larger, newer meta-analysis. O*NET
    # Enterprising: managing, negotiating, marketing or selling, or leading or advising people;
    # selling, finance, politics and law left out. Same checks and limits as above.
