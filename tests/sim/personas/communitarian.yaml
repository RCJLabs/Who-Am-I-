  # Consistent: moderate on bodily autonomy everywhere, protective everywhere, wary of paid markets
  # in bodies everywhere. In the rights topics too: protective on guns as on drugs and vaccines,
  # liberty equally modest for speech and private messages, the law binding on protesters and
  # religious objectors alike, and due process weighed the same for guns and freedom. In economics:
  # money shouldn't buy quicker treatment any more than a kidney or sex, and just deserts weighs
  # about the same for people who could work and for heirs.
  # In governance too: national self-government, deciding locally and deferring to experts each
  # weigh about the same wherever they come up.
  # In society too: the same rules for everyone, deserved punishment, personal responsibility and
  # self-government each weigh about the same wherever they come up.
