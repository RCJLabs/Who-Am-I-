# yaml-language-server: $schema=../../../schema/topic.schema.json
# How the law should treat same-sex couples. The ladder splits at marriage, so challenges about
# what marriage is for reach only people who support it, and challenges about recognizing couples
# reach only people who don't. The top step adds what schools teach, the live dispute now. The
# religious-liberty conflicts (bakers, photographers, registrars) belong to rights/religious_liberty
# and aren't repeated here. Feeds the cultural spectrum at full weight. The anchor is the same rules
# whatever someone's sex, where the left tends to invoke it. Yields toward recognition record the
# same rules for everyone or liberty; toward the traditional definition, respect for the natural
# order or authority.
id: same_sex_marriage
domain: society
title: Same-sex relationships and marriage
summary: How should the law treat same-sex couples?
tier: core
order: 3
evidence: custom
stance: stance
importance: importance
items:
  - id: stance
    type: slider
    steps: 7
    text: When it comes to same-sex couples, the law should…
    poles: [Make same-sex relationships a crime, Allow marriage with every right]
    labels:
      - Make sex between two men or two women a crime
      - Allow it, but not recognize same-sex couples in any way
      - Offer civil partnerships with some or all of the rights of marriage, but not marriage
      - Torn / it depends
      - Allow marriage, but keep joint adoption for a mother and a father
      - Allow marriage with every right, including adopting children together
      - Allow marriage with every right, and have schools teach that same-sex families are as valid as any other
    axes: { cultural: 1 }

  - id: importance
    type: importance
    text: How much does this issue matter to you?

  # --- Circumstances ---------------------------------------------------------------------------
  - id: courts
    type: slider
    steps: 5
    tags: [circumstance]
    text: Courts requiring same-sex marriage before voters or lawmakers have approved it is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]

  - id: therapy_ban
    type: slider
    steps: 5
    tags: [circumstance]
    text: Banning therapy that tries to change a young person's sexual orientation, even when they and their parents want it, is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]
    principles: { protect_vulnerable: 0.5 }

  - id: blood
    type: slider
    steps: 5
    deep: true
    tags: [circumstance]
    text: Blood services asking every donor the same questions about recent sex, whatever their sexual orientation, is…
    poles: [A bad idea, A good idea]
    labels: [A bad idea, Probably a bad idea, Torn, Probably a good idea, A good idea]
    principles: { equal_treatment: 0.5 }

  - id: more_than_two
    type: slider
    steps: 5
    deep: true
    tags: [circumstance]
    text: Legal recognition for committed relationships of more than two adults is…
    poles: [Wrong, Right]
    labels: [Wrong, Probably wrong, Torn, Probably right, Right]

  # --- Anchor ------------------------------------------------------------------------------------
  - id: anchor_same
    type: likert
    points: 7
    text: When it comes to who may marry whom, everyone should be treated by the same rules, whatever their sex, even when that changes what marriage has meant in most cultures.
    principles: { equal_treatment: 1 }
    anchor: { principle: equal_treatment, context: who may marry whom, against: what marriage has meant in most cultures }

  # --- Challenges: for recognizing same-sex couples ----------------------------------------------
  - id: ch_windsor
    type: challenge
    name: The estate tax
    targets: stance
    when: stance < 0
    source: United States v. Windsor, 570 U.S. 744 (2013)
    scenario: >-
      Edith Windsor and Thea Spyer were a couple for more than 40 years and married in Canada in
      2007. When Spyer died, US federal law didn't recognize their marriage, so Windsor owed $363,053
      in estate tax that a woman married to a man wouldn't have owed.
    text: Should the law treat a partnership of more than 40 years as if the two were strangers?
    options:
      - id: purpose
        label: Marriage law has a purpose beyond the couple, tying children to their mother and father.
        reaction: hold
        principles: { natural_order: 0.5 }
      - id: partnerships
        label: No. Protect couples like them with civil partnerships, but keep marriage for a man and a woman.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me more open to recognizing same-sex couples than I said.
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }

  - id: ch_loving
    type: challenge
    name: Loving v. Virginia
    targets: stance
    when: stance < 0
    source: Loving v. Virginia, 388 U.S. 1 (1967)
    scenario: >-
      Until 1967, Virginia banned marriage between white people and people of other races, arguing
      that the ban applied equally to white and non-white people. The US Supreme Court unanimously
      struck it down, calling the freedom to marry one of the vital personal rights essential to the
      orderly pursuit of happiness.
    text: Is limiting marriage by sex different from limiting it by race?
    options:
      - id: what_marriage_is
        label: Yes. Race has nothing to do with what marriage is; being a man and a woman does.
        reaction: hold
        principles: { natural_order: 0.5 }
      - id: some_recognition
        label: The cases differ, but the law should still protect same-sex couples in some way.
        reaction: distinguish
        value: 0
      - id: rethink
        label: Not really. It makes me more open to recognizing same-sex couples than I said.
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }

  - id: ch_turing
    type: challenge
    name: Alan Turing
    targets: stance
    deep: true
    when: stance < -0.8
    source: Alan Turing's conviction (1952) and royal pardon (2013)
    scenario: >-
      In 1952 the British mathematician Alan Turing, who had helped break German codes in the Second
      World War, was convicted of gross indecency for a relationship with another man and agreed to
      hormone treatment to avoid prison. He died two years later. In 2013 he was pardoned.
    text: Should consenting adults ever be punished for a relationship?
    options:
      - id: standards
        label: The law should uphold moral standards, even in private life.
        reaction: hold
        principles: { purity: 0.5 }
      - id: milder
        label: Not like that, but the law can still set a standard with milder penalties.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me think the law should leave same-sex couples alone.
        reaction: yield
        revise: stance
        principles: { liberty: 0.5 }

  # --- Challenges: for the traditional definition -------------------------------------------------
  - id: ch_purpose
    type: challenge
    name: What marriage is for
    targets: stance
    when: stance > 0
    source: >-
      Hernandez v. Robles, 7 N.Y.3d 338 (2006); Sherif Girgis, Ryan Anderson and Robert George,
      What Is Marriage? Man and Woman: A Defense (2012)
    scenario: >-
      In 2006 New York's highest court ruled that the state could limit marriage to a man and a
      woman. Its lead opinion said lawmakers could rationally believe that, other things being equal,
      children do better with both a mother and a father. Some philosophers argue that marriage is by
      nature the union of a man and a woman, a bond fulfilled by having and raising children
      together.
    text: Is marriage mainly about the couple, or about the children they may have?
    options:
      - id: couple
        label: The couple. Couples who can't have children marry too, and same-sex couples raise children.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: know_parents
        label: Marriage for everyone, but every child should have a legal right to know their biological parents.
        reaction: distinguish
        value: 0
      - id: rethink
        label: The children. It makes me less sure about same-sex marriage than I said.
        reaction: yield
        revise: stance
        principles: { natural_order: 0.5 }

  - id: ch_two
    type: challenge
    name: Why only two?
    targets: stance
    when: stance > 0
    source: >-
      Obergefell v. Hodges, 576 U.S. 644 (2015) (Roberts, C.J., dissenting); City of Somerville,
      Massachusetts, domestic partnership ordinance (2020)
    scenario: >-
      Dissenting from the 2015 US Supreme Court ruling that required same-sex marriage, the Chief
      Justice wrote that much of its reasoning would apply with equal force to marriages of more
      than two people. In 2020 Somerville, Massachusetts, became the first US city to recognize
      partnerships of three or more adults.
    text: If marriage is about love and commitment, why limit it to two people?
    options:
      - id: equal_spouses
        label: Two-person marriage protects equality between spouses. That's a real reason; a person's sex isn't.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: separate
        label: That's a separate question. Same-sex marriage doesn't commit us to it.
        reaction: distinguish
        value: 0
      - id: rethink
        label: It makes me think marriage needs firmer limits than I said.
        reaction: yield
        revise: stance
        principles: { natural_order: 0.5 }

  - id: ch_storybooks
    type: challenge
    name: The storybooks
    targets: stance
    deep: true
    when: stance > 0.8
    source: Mahmoud v. Taylor, US Supreme Court (2025)
    scenario: >-
      In 2025 the US Supreme Court ruled, 6 to 3, that parents in a Maryland school district could
      take their young children out of lessons using storybooks with LGBTQ characters, including
      same-sex couples, because the lessons burdened their religious freedom.
    text: Should schools teach about same-sex families even when parents object?
    options:
      - id: classmates
        label: Yes. Children should learn that families like their classmates' are normal.
        reaction: hold
        principles: { equal_treatment: 0.5 }
      - id: opt_out
        label: Teach it, but let parents with religious objections take their children out.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me think schools should leave this to parents.
        reaction: yield
        revise: stance
        principles: { authority: 0.5 }

  # --- Challenge: aimed at the therapy ban -------------------------------------------------------
  - id: ch_talk_therapy
    type: challenge
    name: Talking, not treating
    targets: therapy_ban
    deep: true
    when: therapy_ban > 0
    source: Chiles v. Salazar, US Supreme Court (2026)
    scenario: >-
      Colorado banned licensed counselors from trying to change a minor's sexual orientation or
      gender identity, including through talk alone. In 2026 the US Supreme Court ruled, 8 to 1,
      that as applied to talk therapy the ban lets counselors voice some views but not others, so it
      must meet the strictest test the Constitution sets for limits on speech.
    text: Should the law decide what a counselor may say to a young person who asks for help?
    options:
      - id: harm
        label: Yes. Trying to change someone's orientation harms young people, whatever form it takes.
        reaction: hold
        principles: { protect_vulnerable: 0.5 }
      - id: physical
        label: Ban physical or coercive practices, but leave conversation alone.
        reaction: distinguish
        value: 0
      - id: rethink
        label: No. It makes me less sure about the ban than I said.
        reaction: yield
        revise: therapy_ban
        principles: { liberty: 0.5 }

  # --- Challenge: the middle ---------------------------------------------------------------------
  - id: ch_vote
    type: challenge
    name: Equal marriage
    targets: stance
    when: stance == 0
    source: Original scenario
    scenario: >-
      A proposed law would let same-sex couples marry, with every right of marriage, including
      adopting children together.
    text: You said you're torn. How would you vote?
    options:
      - id: abstain
        label: I'd leave it blank. Both sides have real force.
        reaction: hold
        value: 0
      - id: yes
        label: "Yes"
        reaction: yield
        revise: stance
        principles: { equal_treatment: 0.5 }
      - id: no
        label: "No"
        reaction: yield
        revise: stance
        principles: { natural_order: 0.5 }

  - id: stance_check
    type: reask
    target: stance
    text: Having thought about these cases, where do you land now?
