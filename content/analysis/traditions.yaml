# yaml-language-server: $schema=../../schema/analysis/traditions.schema.json
# Political traditions: reference points for the results, never a label for anyone, never a party,
# never a recommendation. Each is placed by its answer sheet in sheets/, scored by the engine like
# anyone's answers. Names and summaries are in adherents' own terms. `side` only checks balance
# (E014) and is never shown. Each tradition's first critique comes from the other side; a center
# tradition's first two, one from each.
compare: [equality, retribution, loyalty, liberty, collective_welfare, market_limits]
traditions:
  - id: democratic_socialist
    name: Democratic socialism
    adherents: democratic socialists
    side: left
    summary: >-
      Democratic socialists aim to extend democracy from government into the economy, so that
      wealth and power are shared far more equally and everyone has the real means to live a free
      and full life. They pursue this gradually, through elected majorities, strong unions, public
      and cooperative ownership and universal services, while keeping civil liberties and political
      pluralism. They accept higher taxes, a larger public sector and firm limits on what owners and
      markets may decide, and that change won by votes is slow and can be undone.
    neighbours:
      - id: social_democrat
        split: >-
          Democratic socialists want to move beyond capitalism toward social and cooperative
          ownership; social democrats keep a market economy and share its gains through welfare,
          unions and taxes.
      - id: green
        split: >-
          Democratic socialists and greens both want deep economic change; democratic socialists
          put ownership and class first, greens put ecological limits and small-scale, local
          economies first.
    inside:
      - cohen_why_not_socialism
      - wright_anticapitalist
    outside:
      - hayek_road_to_serfdom
      - crosland_future_of_socialism

  - id: green
    name: Green politics
    adherents: greens
    side: left
    summary: >-
      Green politics, or political ecology, holds that a finite planet sets limits to growth, so a
      lasting society must live within them and hand on a living world to future generations and
      other species. It aims at decentralized, human-scale economies, grassroots democracy and
      nonviolence, with wealth shared far more equally within and between countries. It accepts
      lower material consumption, higher prices for what harms nature, and an economy that no
      longer treats growth as its goal.
    neighbours:
      - id: democratic_socialist
        split: >-
          Greens and democratic socialists both want deep economic change; greens put ecological
          limits and small-scale, local economies first, democratic socialists put ownership and
          class first.
      - id: social_democrat
        split: >-
          Greens doubt that growth can go on within the planet's limits and put ecology first;
          social democrats count on growth to pay for welfare and good jobs.
      - id: social_liberal
        split: >-
          Greens and social liberals share commitments to civil liberties and social justice;
          greens doubt that growth can continue within ecological limits, social liberals expect
          growth and markets to serve those commitments.
    inside:
      - schumacher_small_is_beautiful
      - meadows_limits_to_growth
    outside:
      - simon_ultimate_resource
      - scruton_green_philosophy

  - id: social_democrat
    name: Social democracy
    adherents: social democrats
    side: left
    summary: >-
      Social democracy seeks a society of equals built by democratic reform rather than revolution,
      keeping the market economy but harnessing it through strong unions, universal public services
      and progressive taxes, so that freedom, security and life chances are widely shared. It
      accepts high taxes, a large public sector and firm limits on what owners and employers may
      do, and it depends on high employment and broad public trust to keep that bargain affordable.
    neighbours:
      - id: democratic_socialist
        split: >-
          Social democrats keep a market economy and share its gains through welfare, unions and
          taxes; democratic socialists want to move beyond capitalism toward social and
          cooperative ownership.
      - id: green
        split: >-
          Social democrats count on growth to pay for welfare and good jobs; greens doubt that
          growth can go on within the planet's limits and put ecology first.
      - id: social_liberal
        split: >-
          Social democrats build fairness around unions and collective bargaining; social liberals
          put more weight on individual rights, competition and equal opportunity.
      - id: left_communitarian
        split: >-
          Social democrats and left communitarians both want security for working people; social
          democrats put more weight on personal freedom and openness, left communitarians on
          family, place and nation.
    inside:
      - judt_ill_fares_the_land
      - crosland_future_of_socialism
    outside:
      - de_jouvenel_ethics_of_redistribution
      - wright_anticapitalist

  - id: social_liberal
    name: Social liberalism
    adherents: social liberals
    side: left
    summary: >-
      Social liberalism aims at a society in which everyone can choose and pursue their own way of
      life and has the real means to do so: education, health care, security against poverty and
      opportunities open to all. It shields speech, privacy and choices that harm no one else,
      while expecting the state to set fair rules for markets and judging inequalities by whether
      they also benefit the least advantaged. It accepts higher taxes on the well-off, closer
      regulation of business, and the risk of people making unwise choices about their own lives.
    neighbours:
      - id: social_democrat
        split: >-
          Social liberals put more weight on individual rights, competition and equal opportunity;
          social democrats build fairness around unions and collective bargaining.
      - id: green
        split: >-
          Social liberals and greens share commitments to civil liberties and social justice;
          social liberals expect growth and markets to serve those commitments, greens doubt that
          growth can continue within ecological limits.
      - id: centrist
        split: >-
          Social liberals reason from principles of individual rights and fair opportunity;
          centrists distrust any single set of principles and seek compromises that rival views can
          accept.
      - id: classical_liberal
        split: >-
          Social liberals think freedom needs the means to use it, such as education, health care
          and an income floor; classical liberals take freedom to mean freedom from coercion, and
          keep the state small.
    inside:
      - hobhouse_liberalism
      - rawls_theory_of_justice
    outside:
      - minogue_liberal_mind
      - sandel_liberalism_and_the_limits_of_justice

  - id: left_communitarian
    name: Left communitarianism
    adherents: left communitarians
    side: left
    summary: >-
      Left communitarianism aims at a common life in which working people have security, dignity
      and a voice, with solidarity rooted in work, family, place and nation and upheld by unions,
      decent wages and redistribution. It holds that markets and individual choice should answer to
      the communities people belong to, and that a shared national identity is what makes people
      willing to share with one another. It accepts higher taxes, firmer limits on markets and on
      some personal freedoms, and less openness to immigration and trade, as the price of secure
      work and settled communities.
    neighbours:
      - id: social_democrat
        split: >-
          Left communitarians and social democrats both want security for working people; left
          communitarians put more weight on family, place and nation, social democrats on personal
          freedom and openness.
      - id: communitarian
        split: >-
          Left communitarians and communitarians both ground solidarity in family and community;
          left communitarians look more to unions, redistribution and the nation, communitarians to
          partnership between employers and workers and to cooperation among nations.
      - id: national_conservative
        split: >-
          Left communitarians and national conservatives share loyalty to nation, family and work;
          left communitarians look to unions and redistribution, national conservatives lean more
          on markets and business.
    inside:
      - orwell_lion_and_unicorn
      - lasch_true_and_only_heaven
    outside:
      - olson_rise_and_decline_of_nations
      - appiah_lies_that_bind

  - id: centrist
    name: Centrism
    adherents: centrists
    side: center
    summary: >-
      Centrism aims to keep a plural society free and governable: since rival interests and
      convictions must share power, it treats compromise as a value in itself and distrusts any
      single doctrine that claims the whole truth. It prefers step-by-step reform that can be tested
      and corrected, within a mixed economy, a welfare state and the rule of law. It accepts slower
      change, untidy bargains and the charge of lacking conviction as the price of keeping mistakes
      reversible and opponents inside shared institutions.
    neighbours:
      - id: social_liberal
        split: >-
          Centrists distrust any single set of principles and seek compromises that rival views can
          accept; social liberals reason from principles of individual rights and fair opportunity.
      - id: communitarian
        split: >-
          Centrists look for workable compromises among rival views; communitarians start from a
          shared idea of the common good, rooted in families and communities.
      - id: classical_liberal
        split: >-
          Centrists distrust fixed principles and weigh the state's role case by case; classical
          liberals hold to the principle that government should be limited.
    inside:
      - schlesinger_vital_center
      - craiutu_faces_of_moderation
    outside:
      - mouffe_on_the_political
      - mises_middle_of_the_road

  - id: communitarian
    name: Communitarianism
    adherents: communitarians
    side: center
    summary: >-
      Communitarianism, in its civic strand and in the older Christian democratic tradition, seeks a
      common good built by families, local communities, employers, unions and the other bodies of
      civil society, with each task left to the smallest body able to carry it and the state
      supporting them rather than taking their place. It pairs a social market economy, where
      employers and workers bargain as partners, with shared moral standards and binding
      cooperation among nations. It accepts that personal choice will sometimes give way to duties
      toward others, and that some goods are kept out of the market, as the price of sturdier
      families and a stronger civic life.
    neighbours:
      - id: centrist
        split: >-
          Communitarians start from a shared idea of the common good, rooted in families and
          communities; centrists look for workable compromises among rival views.
      - id: traditional_conservative
        split: >-
          Communitarians want the state, employers and unions to work together for the common good;
          traditional conservatives are warier of state action and prefer institutions that grew on
          their own.
      - id: left_communitarian
        split: >-
          Communitarians and left communitarians both ground solidarity in family and community;
          communitarians look to partnership between employers and workers and to cooperation
          among nations, left communitarians more to unions, redistribution and the nation.
    inside:
      - etzioni_spirit_of_community
      - maritain_man_and_the_state
    outside:
      - holmes_anatomy_of_antiliberalism
      - kukathas_liberal_archipelago

  - id: classical_liberal
    name: Classical liberalism
    adherents: classical liberals
    side: right
    summary: >-
      Classical liberalism aims at a society of free individuals under general laws that bind
      government as firmly as anyone else, where markets and voluntary exchange, rather than central
      direction, coordinate economic life. Government is kept to defense, justice, public goods and
      a basic safety net, paid for by low and simple taxes. It accepts large inequalities, rewards
      that often bear little relation to merit, and hard consequences for some choices, as a
      smaller cost than what the alternatives would take from liberty and prosperity.
    neighbours:
      - id: libertarian
        split: >-
          Classical liberals accept a limited state with public goods and a basic safety net;
          libertarians would confine the state to protecting people and property, and some would
          do without it.
      - id: social_liberal
        split: >-
          Classical liberals take freedom to mean freedom from coercion, and keep the state small;
          social liberals think freedom needs the means to use it, such as education, health care
          and an income floor.
      - id: traditional_conservative
        split: >-
          Classical liberals and traditional conservatives both defend markets and limited
          government; classical liberals welcome the changes free people choose, traditional
          conservatives value inherited customs even when reason can't fully justify them.
      - id: centrist
        split: >-
          Classical liberals hold to the principle that government should be limited; centrists
          distrust fixed principles and weigh the state's role case by case.
    inside:
      - friedman_capitalism_and_freedom
      - hayek_constitution_of_liberty
    outside:
      - polanyi_great_transformation
      - hobhouse_liberalism

  - id: libertarian
    name: Libertarianism
    adherents: libertarians
    side: right
    summary: >-
      Free-market libertarianism holds that each person owns their own life and should be free to
      live it as they choose, so long as they respect the same freedom in others. It would confine
      the state to protecting people and property from force and fraud, with some adherents handing
      even that to competing private agencies, and leave the rest to markets and voluntary
      association. It accepts large differences in wealth, a safety net left to family, charity and
      mutual aid rather than guaranteed by law, and some people using their freedom badly, as the
      price of a society run on consent.
    neighbours:
      - id: classical_liberal
        split: >-
          Libertarians would confine the state to protecting people and property, and some would do
          without it; classical liberals accept a limited state with public goods and a basic
          safety net.
    inside:
      - nozick_anarchy_state_and_utopia
      - boaz_libertarianism_primer
    outside:
      - anderson_private_government
      - kirk_chirping_sectaries

  - id: traditional_conservative
    name: Traditional conservatism
    adherents: traditional conservatives
    side: right
    summary: >-
      Traditional conservatism seeks to keep and gradually improve what a society has inherited,
      such as the family, religion, local community, the rule of law and the nation, on the view
      that these hold practical wisdom no single generation could design afresh. It favors limited
      government, private property and a strong civil society of voluntary associations, with the
      state keeping order and a safety net rather than directing how people live. It accepts
      lasting inequality, slower redress of some wrongs, and limits that custom places on
      individual choice, as the cost of continuity, stability and belonging.
    neighbours:
      - id: national_conservative
        split: >-
          Traditional conservatives put continuity and gradual change first; national
          conservatives put the nation's cohesion and self-government first, and will use the state
          more actively to protect them, on trade and immigration too.
      - id: communitarian
        split: >-
          Traditional conservatives are warier of state action and prefer institutions that grew on
          their own; communitarians want the state, employers and unions to work together for the
          common good.
      - id: classical_liberal
        split: >-
          Traditional conservatives and classical liberals both defend markets and limited
          government; traditional conservatives value inherited customs even when reason can't
          fully justify them, classical liberals welcome the changes free people choose.
    inside:
      - burke_reflections
      - oakeshott_on_being_conservative
    outside:
      - paine_rights_of_man
      - hayek_why_not_conservative

  - id: national_conservative
    name: National conservatism
    adherents: national conservatives
    side: right
    summary: >-
      National conservatism holds that the independent nation, bound by shared territory, language,
      history and the loyalty of its members to one another, is the basis of self-government, the
      rule of law and solidarity among citizens. It seeks borders the nation controls, newcomers
      who integrate, strong families, a public place for the nation's inherited religion and
      culture, and a state that shapes trade and industry for its own people rather than deferring
      to global markets or supranational bodies. It accepts higher prices and some lost growth from
      protecting industry and admitting fewer newcomers, and looser international commitments, as
      the price of cohesion and democratic control.
    neighbours:
      - id: traditional_conservative
        split: >-
          National conservatives put the nation's cohesion and self-government first, and will use
          the state more actively to protect them, on trade and immigration too; traditional
          conservatives put continuity and gradual change first.
      - id: left_communitarian
        split: >-
          National conservatives and left communitarians share loyalty to nation, family and work;
          national conservatives lean more on markets and business, left communitarians on unions
          and redistribution.
    inside:
      - hazony_virtue_of_nationalism
      - scruton_need_for_nations
    outside:
      - nussbaum_patriotism_and_cosmopolitanism
      - acton_nationality
