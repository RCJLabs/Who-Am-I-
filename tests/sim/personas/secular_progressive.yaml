  # The mirror image of the religious conservative: bodily autonomy and protecting the vulnerable
  # flip on vaccines; the sanctity of life and caution with the irreversible are high on the death
  # penalty but low on abortion, assisted dying and gene editing. And Rachels's target: killing and
  # letting die are the same in end-of-life care, but not when pushing a stranger onto the tracks.
  # In the rights topics, each new principle flips the other way from the religious conservative:
  # protecting the vulnerable high on guns, liberty high for private messages but not speech,
  # obeying the law required of religious objectors but not protesters, due process demanded before
  # losing freedom but not guns, and doing vs. allowing high for torture. In the economics topics,
  # just deserts is demanded of heirs but not of people who could work, and money shouldn't buy
  # quicker medical treatment, though surrogates may be paid.
  # In governance, the mirror image again: no outside interference in who rules a country, but
  # international courts may try a country's soldiers; minimum wages may be set locally, but
  # school curricula may not; and experts should decide in general and on school vaccines, but
  # not economists on rents.
