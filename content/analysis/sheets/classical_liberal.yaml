# yaml-language-server: $schema=../../../schema/analysis/sheet.schema.json
# Classical liberalism: the app's political questions, and the statements behind the compared principles,
# answered as a thoughtful adherent would, from the tradition's own writers. Written blind: the
# author saw only this tradition and its sources. The compiler scores it like anyone's answers.
tradition: classical_liberal
sources:
  - Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776)
  - F. A. Hayek, The Constitution of Liberty (1960)
  - Milton Friedman, Capitalism and Freedom (1962)
answers:
  fairness.stance: 3   # Market outcomes are neither just nor unjust, but there is a floor for all (Hayek, The Constitution of Liberty)
  abortion.stance: 5   # Sovereignty over one's own body favors early choice; most accept limits later in pregnancy (cf. Mill, On Liberty)
  assisted_dying.stance: 6   # Competent adults decide about their own lives, with safeguards (Mill, On Liberty)
  vaccine_mandates.stance: 3   # Contagion harms others, so narrow mandates where risk is concentrated (Mill, On Liberty, harm principle)
  death_penalty.stance: 1   # The state should not hold the power to kill; errors cannot be undone (Beccaria, On Crimes and Punishments)
  drug_policy.stance: 6   # Prohibition fails and breeds crime; a regulated adult market instead (Friedman, "Prohibition and Drugs")
  paternalism.stance: 2   # Warn and label, but never coerce adults for their own good (Mill, On Liberty, ch. 5)
  organ_donation.stance: 6   # A regulated price would end kidney shortages (Becker and Elias, Journal of Economic Perspectives, 2007)
  sex_work.stance: 6   # Consenting adults decide, under ordinary health and licensing rules (Mill, On Liberty)
  surrogacy.stance: 6   # Freedom of contract, with agreements enforced (Epstein, "Surrogacy: The Case for Full Contractual Enforcement")
  gene_editing.stance: 5   # Parents may prevent serious disease; caution over unforeseeable harms to future generations
  free_speech.stance: 1   # Only incitement to imminent harm may be punished (Mill, On Liberty, the corn-dealer example)
  surveillance.stance: 2   # Warrants under oversight; bulk monitoring treats everyone as a suspect (Hayek, The Constitution of Liberty, ch. 14)
  religious_liberty.stance: 5   # Freedom of conscience and association, unless others are seriously harmed (Friedman, Capitalism and Freedom, ch. 7)
  protest.stance: 2   # Equality before the law means the same rules for protesters as for anyone (Hayek, The Constitution of Liberty)
  torture.stance: 1   # Torture is never a legitimate use of state power (Beccaria, On Crimes and Punishments)
  public_safety.stance: 2   # Due process and the presumption of innocence protect everyone (Hayek, The Constitution of Liberty, ch. 14)
  taxes.stance: 2   # Redistribute only to secure a floor, via a negative income tax (Friedman, Capitalism and Freedom, ch. 12)
  healthcare.stance: 3   # Compulsory insurance with help for the poor, not a state monopoly (Hayek, The Constitution of Liberty, ch. 19)
  welfare.stance: 3   # A modest floor that keeps the incentive to work (Friedman, Capitalism and Freedom, ch. 12)
  minimum_wage.stance: 1   # It prices the least skilled out of jobs; help them through the tax system (Friedman, Capitalism and Freedom)
  regulation.stance: 3   # General rules suit a free economy; discretionary controls do not (Hayek, The Constitution of Liberty, ch. 15)
  unions.stance: 2   # Voluntary unions yes, coercive legal privileges no (Hayek, The Constitution of Liberty, ch. 18)
  trade.stance: 6   # Free trade, with few exceptions such as defense (Smith, Wealth of Nations, Book IV, ch. 2)
  housing.stance: 1   # Rent controls shrink and degrade the housing stock (Friedman and Stigler, "Roofs or Ceilings?")
  inheritance.stance: 1   # Passing on material advantages to children is legitimate (Hayek, The Constitution of Liberty, ch. 6)
  immigration.stance: 5   # Free movement of labor is a gain (Smith, Wealth of Nations, Book I, ch. 10), tempered by welfare costs
  policing.stance: 5   # Protecting people from injustice is the state's core duty (Smith, Wealth of Nations, Book V, ch. 1)
  same_sex_marriage.stance: 6   # Equal legal rights for same-sex couples; law should not enforce private morals (Mill, On Liberty)
  gender_roles.stance: 3   # Government should not steer how couples divide work and care (Mill, On Liberty)
  prisons.stance: 3   # Certain punishment deters better than severe punishment (Beccaria, On Crimes and Punishments)
  climate.stance: 3   # Price emissions and let markets find the cheapest cuts, not a costly planned transition (Friedman, Capitalism and Freedom)
  cooperation.stance: 5   # Enforceable international rules restrain national governments (Hayek, "The Economic Conditions of Interstate Federalism")
  foreign_aid.stance: 3   # Trade over aid; small, accountable programs at most (Easterly, The White Man's Burden)
  marriage.stance: 6   # A voluntary contract either spouse may end, after a short wait (Mill, On Liberty, ch. 5)
  gambling.stance: 6   # Adults may risk their own money; warnings and self-set limits, not bans (Mill, On Liberty, ch. 5)
  moral_foundations.loyalty_1: 4   # Proud of a common heritage, while government is a means, not a master (Friedman, Capitalism and Freedom, introduction)
  moral_foundations.equality_3: 4   # Equal opportunity is compatible with freedom; equal outcomes are not (Friedman, Free to Choose, ch. 5)
  moral_foundations.liberty_3: 2   # Freedom may be limited only by general rules protecting others, not for social goals (Hayek, The Constitution of Liberty)
  moral_foundations.deserts_1: 4   # "To each according to what he and the instruments he owns produces" (Friedman, Capitalism and Freedom, ch. 10)
  moral_foundations.equality_1: 2   # Rising living standards for all matter more than equal shares (Hayek, The Constitution of Liberty, ch. 3)
  moral_foundations.loyalty_3: 2   # Love of one's own country and community is natural and fitting (Smith, The Theory of Moral Sentiments)
  moral_foundations.deserts_2: 4   # Rewards should follow contribution, not be equalized regardless of it (Friedman, Capitalism and Freedom, ch. 10)
  moral_foundations.liberty_1: 4   # Licensing, price controls and paternalist rules reach too far (Friedman, Capitalism and Freedom, ch. 2)
  moral_foundations.equality_2: 1   # Outcomes of an impersonal market are neither just nor unjust (Hayek, The Mirage of Social Justice)
  moral_foundations.deserts_3: 2   # A floor for all, but rewards should track the value people create (Friedman, Capitalism and Freedom)
  moral_foundations.loyalty_2: 2   # Individuals must be free to leave any group; harming others is far worse (Mill, On Liberty)
  moral_foundations.liberty_2: 4   # Over one's own life the individual is sovereign (Mill, On Liberty, ch. 1)
  organ_donation.anchor_ml: 2   # Consenting adults should be able to sell, under regulation (Becker and Elias, 2007)
  sex_work.anchor_ml: 2   # A ban overrides the choices of consenting adults (Mill, On Liberty)
  surrogacy.anchor_ml: 2   # Paid surrogacy is a legitimate contract (Epstein, Virginia Law Review, 1995)
  free_speech.anchor_liberty: 7   # Liberty of thought and discussion covers hateful opinions too (Mill, On Liberty, ch. 2)
  surveillance.anchor_liberty: 6   # Private correspondence lies in the protected private sphere (Hayek, The Constitution of Liberty, ch. 14)
  healthcare.anchor_ml: 1   # Barring private payment for one's own care makes the state a monopolist (Hayek, The Constitution of Liberty, ch. 19)
  welfare.anchor_desert: 2   # A minimum for those who cannot support themselves belongs in a free society (Hayek, The Constitution of Liberty, ch. 19)
  unions.anchor_loyal: 2   # Each worker should decide; pressure on fellow workers to strike is coercion (Hayek, The Constitution of Liberty, ch. 18)
  inheritance.anchor_desert: 1   # Parents may pass on material as well as other advantages (Hayek, The Constitution of Liberty, ch. 6)
  war.anchor_loyal: 2   # Free citizens may oppose a mistaken war; Friedman opposed peacetime conscription (Capitalism and Freedom, ch. 2)
  marriage.anchor_lib: 6   # Spouses are free to end a voluntary contract (Mill, On Liberty, ch. 5)
  family_crime.anchor_loyal: 2   # Justice, the main pillar of society, outweighs partiality to kin (Smith, The Theory of Moral Sentiments)
  work.anchor_cw: 2   # Work is a personal choice; people of independent means serve a free society too (Hayek, The Constitution of Liberty, ch. 8)
  work.anchor_lib: 5   # Freedom of contract on hours, though limits on working hours fit a free economy (Hayek, The Road to Serfdom, ch. 3)
  health.anchor_cw: 3   # Help for those who cannot pay, but not solidarity as the governing principle (Hayek, The Constitution of Liberty, ch. 19)
  gambling.anchor_lib: 6   # Adults may bet their own money (Mill, On Liberty, ch. 5)
divided:
  - guns.stance   # US adherents defend an individual right with background checks; most elsewhere accept strict licensing
  - transgender.stance   # One camp backs legal change by self-declaration; the other keeps medical criteria and birth sex in single-sex spaces
