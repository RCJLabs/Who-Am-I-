# Spectrums shown in results. poles: [negative end, positive end].
# Evidence rule: below minWeight (or fewer than minTopics topics) the axis shows "not enough data";
# confidence reaches 1 at fullWeight. Political axes are fed only by stances (weight 1 per core
# topic, 0.5 per deep dive), so 1.5 is, for example, one core topic plus one deep dive.

# --- Political ---
- id: economic
  family: political
  title: Economic
  description: Should markets or collective action decide who gets what?
  poles: [Equality, Markets]
  minWeight: 1.5
  fullWeight: 6
  minTopics: 2
- id: civil
  family: political
  title: Civil
  description: How far should the state limit individual freedom for safety, order or the common good?
  poles: [Liberty, Authority]
  minWeight: 1.5
  fullWeight: 6
  minTopics: 2
- id: cultural
  family: political
  title: Cultural
  description: Should society hold to established norms, or reform them?
  poles: [Tradition, Progress]
  minWeight: 1.5
  fullWeight: 6
  minTopics: 2
# Three core topics feed this axis so far (shared rules, foreign aid, immigration), so the most
# anyone can give is weight 3. A full weight of 6 would mark every answer "based on few answers";
# at 4, answering all three reads as a real but partial picture. Raise it as more topics feed it.
- id: diplomatic
  family: political
  title: Diplomatic
  description: Should your country put its own interests first, or cooperate globally?
  poles: [National, Global]
  minWeight: 1.5
  fullWeight: 4
  minTopics: 2

# --- Values: what you prioritize, and how you reason about right and wrong ---
# The first two follow the two main dimensions of Shalom Schwartz's theory of basic values; the
# last two follow the two dimensions of utilitarian thinking in Kahane et al. (2018).
- id: change
  family: values
  title: Stability or change
  description: Security, tradition and fitting in, or independence, novelty and excitement?
  poles: [Stability, Change]
  minWeight: 2
  fullWeight: 5
- id: others
  family: values
  title: Getting ahead or looking out for others
  description: Success, status and influence, or the welfare of other people and the world?
  poles: [Getting ahead, Others' welfare]
  minWeight: 2
  fullWeight: 5
- id: outcomes
  family: values
  title: Rules or outcomes
  description: Are some things wrong whatever good they would do, or does the outcome decide?
  poles: [Rules, Outcomes]
  minWeight: 2
  fullWeight: 6
- id: impartiality
  family: values
  title: Near or far
  description: Do the people close to you come first, or does everyone's welfare count the same?
  poles: [Close ones first, Everyone equally]
  minWeight: 2
  fullWeight: 6

# --- Worldview (sensitive: like its topics, never shared unless you choose) ---
# Fed by God and religion at full weight and life after death at half. Not by free will, right and
# wrong, or personal identity: each splits believers and nonbelievers alike.
- id: beyond_nature
  family: worldview
  title: The natural world or more
  description: Is the natural world all there is, or is there also God, a higher power, or life after death? It reflects beliefs, not how moral, spiritual or religious you are.
  poles: [Only the natural world, More than the natural world]
  minWeight: 1
  fullWeight: 1.5
  minTopics: 1

# --- How you think: fed only by the changing-your-mind pairs, four each ---
# These describe how people see themselves. The record of how they answered challenges is shown
# separately, and isn't compared with these.
- id: revising
  family: thinking
  title: Steady or flexible
  description: When a view of yours meets a strong challenge, do you hold it while you check, or loosen your grip right away?
  poles: [Steady, Flexible]
  minWeight: 2
  fullWeight: 4
- id: intuition
  family: thinking
  title: Intuition or analysis
  description: When judgment from experience and careful analysis point different ways, which do you lean on?
  poles: [Intuition, Analysis]
  minWeight: 2
  fullWeight: 4

# --- Personality (Big Five; raw position on the scale, no population norms) ---
